# Agentic GRPO / RLVR defaults for the STAR closed-vocabulary setup.
# Paths can be overridden with environment variables of the same names.

data:
  data_root: ${DATA_ROOT:-/root/autodl-tmp/STAR}
  r1sgg_data_root: ${R1SGG_DATA_ROOT:-/root/autodl-tmp/STAR/r1sgg_data}
  star_raw_root: ${STAR_RAW_ROOT:-/root/autodl-tmp/STAR/STAR}
  dataset_path: ${R1SGG_DATA_ROOT:-/root/autodl-tmp/STAR/r1sgg_data}/star_r1sgg_hf_closed
  jsonl_closed_dir: ${R1SGG_DATA_ROOT:-/root/autodl-tmp/STAR/r1sgg_data}/star_r1sgg_jsonl_closed
  split:
    train: train
    eval: val
    test: test
  use_closed_vocab: true

output:
  output_root: ${OUTPUT_ROOT:-/root/autodl-tmp/R1SGG_Agentic_GRPO_outputs}
  subdirs:
    - logs
    - checkpoints
    - predictions
    - eval_results
    - tmp

tool:
  zoom_in:
    max_tool_steps: 2
    padding: 0
    min_crop_size: 1
    output_size: null
    observation_format: image_with_metadata

rollout:
  action_format: json
  final_action: final_answer
  tool_action: zoom_in

reward:
  lambda_format: 0.1
  lambda_tool: 0.2
  strict_format: true
  numeric_tolerance: 0.001
  scene_graph_triplet_threshold: 1.0

grpo:
  num_generations: 4
  clip_eps: 0.2
  beta_kl: 0.0
  advantage_eps: 1.0e-8
  smoke_num_samples: 2
  smoke_num_generations: 2
  smoke_train_steps: 1
  smoke_seq_len: 8


action_sft:
  split: train
  max_samples: 256
  max_objects: 32
  max_relationships: 64
  prompt_mode: dataset
  include_conversations: true
  save_hf_dataset: true
  output_dir: ${ACTION_SFT_OUTPUT_DIR:-}
  overwrite: false

model:
  name_or_path: ${MODEL_NAME_OR_PATH:-/root/autodl-tmp/STAR/r1sgg_data/checkpoints/qwen25vl-7b-sft-star-close-20260507_182608Z}
  processor_path: ${PROCESSOR_PATH:-}
  attn_implementation: ${ATTN_IMPLEMENTATION:-sdpa}
  torch_dtype: ${TORCH_DTYPE:-bfloat16}
  device_map: ${DEVICE_MAP:-cuda}
  max_pixels: null
  min_pixels: null

model_load_smoke:
  split: val
  sample_index: 0
  load_model: true
  build_inputs: true
  max_pixels: 802816
  min_pixels: null

generation_smoke:
  max_new_tokens: 128
  repetition_penalty: 1.05
  do_sample: false
  temperature: null
  max_zoom_steps: 1
  coord_type: pixel
  zoom_output_size: 448
  zoom_min_area_ratio: 1.0e-6
  zoom_max_area_ratio: 0.8
  strict_format: false
  action_reminder: true
  prompt_mode: action_only

rlvr_dataset:
  source: hf_closed
  dataset_path: ${R1SGG_DATA_ROOT:-/root/autodl-tmp/STAR/r1sgg_data}/star_r1sgg_hf_closed
  jsonl_dir: ${R1SGG_DATA_ROOT:-/root/autodl-tmp/STAR/r1sgg_data}/star_r1sgg_jsonl_closed
  train_split: train
  eval_split: val
  test_split: test
  task_type: scene_graph
  prompt_field: prompt_close
  input_style: eagle_grounding
  require_image_exists: true
